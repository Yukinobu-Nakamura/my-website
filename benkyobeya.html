<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="中村幸信の勉強部屋。政治やお金のことを一緒に学べるコンテンツ集。" />
  <meta name="robots" content="noindex" />
  <title>勉強部屋 | 中村幸信公式ホームページ</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/img/favicon.png" type="image/png" sizes="96x96" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

  <link rel="stylesheet" href="style.css?v=20260802c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* このページ専用のスタイル */
    .study-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-hero);
      padding: 40px 24px;
      font-family: var(--font-jp);
    }
    .study-card {
      text-align: center;
      max-width: 640px;
      width: 100%;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(8px);
      padding: 3rem 2rem 2.5rem;
      box-shadow: 0 20px 60px rgba(59,26,120,.4);
    }
    .study-card__img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 1.25rem;
      box-shadow: 0 10px 30px rgba(59,26,120,.35), 0 0 0 6px rgba(255,255,255,.6);
    }
    .study-card__title {
      color: var(--white);
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      font-weight: 700;
      letter-spacing: .06em;
      margin-bottom: .5rem;
    }
    .study-card__text {
      color: rgba(255,255,255,.9);
      font-size: .95rem;
      line-height: 1.9;
      margin-bottom: 1.75rem;
    }
    .study-list {
      display: grid;
      gap: 14px;
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .study-item {
      display: block;
      background: rgba(255,255,255,.95);
      border-radius: 16px;
      padding: 1.1rem 1.3rem;
      text-decoration: none;
      color: var(--purple-800, #3b1a78);
      box-shadow: 0 10px 30px rgba(59,26,120,.3);
      transition: transform .15s, box-shadow .15s;
    }
    .study-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 44px rgba(59,26,120,.45);
    }
    .study-item__label {
      display: inline-block;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      color: #fff;
      background: var(--purple-800, #3b1a78);
      border-radius: 99px;
      padding: 2px 12px;
      margin-bottom: .4rem;
    }
    .study-item__title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: .25rem;
    }
    .study-item__meta {
      font-size: .8rem;
      color: #6b7280;
    }
    .study-item--soon {
      background: rgba(255,255,255,.14);
      color: rgba(255,255,255,.85);
      box-shadow: none;
      border: 1px dashed rgba(255,255,255,.4);
    }
    .study-item--soon:hover { transform: none; box-shadow: none; }
    .study-item--soon .study-item__label { background: rgba(255,255,255,.25); }
    .study-item--soon .study-item__meta { color: rgba(255,255,255,.65); }
    .study-card .btn--home {
      background: var(--white);
      color: var(--purple-800);
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(59,26,120,.35);
    }
    .study-card .btn--home:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(59,26,120,.5);
    }
  </style>
</head>
<body>

  <main class="study-page">
    <section class="study-card">
      <img src="assets/img/nakamura_illust.png" alt="中村幸信のイラスト" class="study-card__img" width="512" height="512" />
      <h1 class="study-card__title">中村幸信の勉強部屋</h1>
      <p class="study-card__text">
        政治やお金のことを、一緒に学べるコンテンツ集です。<br />
        少しずつ増やしていきます。
      </p>

      <div class="study-list">
        <a href="benkyobeya_hp_kouza.html" class="study-item">
          <span class="study-item__label">第1回</span>
          <div class="study-item__title">ホームページの仕組み講座<br />——「家を建てる」に例えると全部わかる</div>
          <div class="study-item__meta">📖 読了目安12分 | 自作のメリット・費用の構造・スパム対策まで</div>
        </a>
        <div class="study-item study-item--soon">
          <span class="study-item__label">準備中</span>
          <div class="study-item__title">次のコンテンツを準備しています</div>
          <div class="study-item__meta">政治とお金の仕組みなど、リクエストもお問い合わせフォームからどうぞ</div>
        </div>
      </div>

      <a href="./" class="btn btn--home">ホームページに戻る</a>
    </section>
  </main>

</body>
</html>
